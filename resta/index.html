<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resta | Operaciones</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial;color:#431407;background:#fff7ed}.card{width:min(440px,100%);padding:34px;border-top:8px solid #ea580c;border-radius:14px;background:#fff;box-shadow:0 18px 45px #7c2d1222}h1{margin:0 0 8px}p{color:#9a3412}label{display:block;margin-top:18px;font-size:.8rem;font-weight:700;text-transform:uppercase}input{width:100%;margin-top:7px;padding:13px;border:2px solid #fdba74;border-radius:8px;font-size:1rem}button,.back{display:block;width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;text-align:center;font-weight:700;cursor:pointer;text-decoration:none}button{color:#fff;background:#ea580c}.back{color:#7c2d12;background:#ffedd5}#resultado{margin-top:18px;padding:14px;border-radius:8px;background:#ffedd5;font-weight:700}</style></head>
<body><main class="card"><h1>− Resta con Django</h1><p>Calcula la diferencia entre dos valores.</p><label for="a">Primer número</label><input id="a" type="number" step="any"><label for="b">Segundo número</label><input id="b" type="number" step="any"><button type="button" onclick="calcular()">Calcular resta</button><div id="resultado" hidden></div><a class="back" href="../">Volver al inicio</a><script>function calcular(){const a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('resultado');if(a.value===''||b.value===''){r.textContent='Ingresa ambos números.';}else{r.textContent='Resultado: '+(Number(a.value)-Number(b.value));}r.hidden=false;}</script></main></body></html>
