<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Suma | Operaciones</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial;color:#365314;background:#f7fee7}.card{width:min(440px,100%);padding:34px;border-top:8px solid #65a30d;border-radius:14px;background:#fff;box-shadow:0 18px 45px #36531422}h1{margin:0 0 8px}p{color:#4d7c0f}label{display:block;margin-top:18px;font-size:.8rem;font-weight:700;text-transform:uppercase}input{width:100%;margin-top:7px;padding:13px;border:2px solid #bef264;border-radius:8px;font-size:1rem}button,.back{display:block;width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;text-align:center;font-weight:700;cursor:pointer;text-decoration:none}button{color:#fff;background:#65a30d}.back{color:#365314;background:#ecfccb}#resultado{margin-top:18px;padding:14px;border-radius:8px;background:#ecfccb;font-weight:700}</style></head>
<body><main class="card"><h1>＋ Suma en Python</h1><p>Ingresa dos valores para obtener el total.</p><label for="a">Primer número</label><input id="a" type="number" step="any"><label for="b">Segundo número</label><input id="b" type="number" step="any"><button type="button" onclick="calcular()">Calcular suma</button><div id="resultado" hidden></div><a class="back" href="../">Volver al inicio</a><script>function calcular(){const a=document.getElementById('a'),b=document.getElementById('b'),r=document.getElementById('resultado');if(a.value===''||b.value===''){r.textContent='Ingresa ambos números.';}else{r.textContent='Resultado: '+(Number(a.value)+Number(b.value));}r.hidden=false;}</script></main></body></html>
