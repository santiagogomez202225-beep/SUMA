<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Suma y Resta</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="number"] { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 16px; outline: none; }
        input[type="number"]:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        .btn { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #219150; }
        .footer { margin-top: 30px; font-size: 12px; color: #bdc3c7; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Calculadora Web</h1>
        <p>Ingresa dos números para restarlos (Django)</p>
        
        <form action="/restar/" method="GET">
            <div class="input-group">
                <input type="number" name="a" placeholder="Número 1" required step="any">
                <input type="number" name="b" placeholder="Número 2" required step="any">
            </div>
            <button type="submit" class="btn">Restar Números</button>
        </form>

        <div class="footer">
            Desplegado con GitHub Actions y Render 🚀
        </div>
    </div>

</body>
</html>
