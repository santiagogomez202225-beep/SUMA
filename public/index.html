<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Suma y Resta</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #2c3e50; margin-bottom: 10px; font-size: 24px; }
        p { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="number"] { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 16px; outline: none; }
        input[type="number"]:focus { border-color: #3498db; }
        .btn-suma { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-suma:hover { background: #2980b9; }
        .btn-resta { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-resta:hover { background: #219150; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TARJETA DE SUMA -->
        <div class="card">
            <h1>Sumar Números</h1>
            <p>Suma ejecutada con Python puro</p>
            <form action="/sumar/" method="GET">
                <div class="input-group">
                    <input type="number" name="a" placeholder="Número 1" required step="any">
                    <input type="number" name="b" placeholder="Número 2" required step="any">
                </div>
                <button type="submit" class="btn-suma">Sumar</button>
            </form>
        </div>

        <!-- TARJETA DE RESTA -->
        <div class="card">
            <h1>Restar Números</h1>
            <p>Resta ejecutada con Django</p>
            <form action="/restar/" method="GET">
                <div class="input-group">
                    <input type="number" name="a" placeholder="Número 1" required step="any">
                    <input type="number" name="b" placeholder="Número 2" required step="any">
                </div>
                <button type="submit" class="btn-resta">Restar</button>
            </form>
        </div>
    </div>

</body>
</html>
