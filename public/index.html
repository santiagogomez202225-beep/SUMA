<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUMA | Operaciones</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Georgia, serif; color: #292524; background: #fef3c7; }
    .shell { width: min(820px, 100%); padding: 46px; border: 3px solid #292524; border-radius: 10px; background: #fff; box-shadow: 12px 12px 0 #f59e0b; }
    .eyebrow { color: #b45309; font: 700 .8rem Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2.4rem, 7vw, 4.8rem); line-height: .95; }
    p { max-width: 540px; font: 1.05rem/1.6 Arial, sans-serif; color: #57534e; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 34px; }
    a { padding: 25px; border: 3px solid #292524; border-radius: 8px; color: #292524; text-decoration: none; font: 700 1.25rem Arial, sans-serif; transition: transform .2s; }
    a:hover { transform: translate(-3px, -3px); }
    .suma { background: #bef264; } .resta { background: #fdba74; }
    span { display: block; margin-top: 9px; font-size: .85rem; font-weight: 400; }
    @media (max-width: 560px) { .shell { padding: 30px 22px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body><main class="shell">
  <div class="eyebrow">Python + Django</div><h1>Operaciones claras.</h1>
  <p>Una pequeña colección para practicar dos tecnologías y resolver cálculos de forma sencilla.</p>
  <nav class="grid">
    <a class="suma" href="./suma/"><strong>＋ Suma</strong><span>Función implementada en Python.</span></a>
    <a class="resta" href="./resta/"><strong>− Resta</strong><span>Vista implementada con Django.</span></a>
  </nav>
</main></body>
</html>
