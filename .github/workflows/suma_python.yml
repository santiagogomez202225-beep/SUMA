name: CI Suma y Resta

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sumar:
    name: Ejecutar Suma (Python puro)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar suma
        run: echo -e "5\n3" | python sumar.py

  restar:
    name: Ejecutar Resta (Django)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Django
        run: |
          python manage.py migrate
          echo "✅ Django configurado correctamente"

  publicar-github-pages:
    name: Publicar GitHub Pages
    needs: [sumar, restar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Aquí se asume que tienes una carpeta llamada "public" con tu index.html
      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

  deploy:
    name: Desplegar en Producción (Render)
    needs: [sumar, restar] # Solo se despliega si las pruebas pasan
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"